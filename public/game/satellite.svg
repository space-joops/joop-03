<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Cassette Futurism Satellite -->
  <style>
    .line {
      fill: none;
      stroke: #39ff14;
      stroke-width: 2;
      stroke-linecap: square;
    }
    .panel {
      fill: rgba(57, 255, 20, 0.2);
      stroke: #39ff14;
      stroke-width: 1.5;
    }
  </style>
  
  <!-- Left Solar Panel -->
  <rect x="4" y="24" width="16" height="16" class="panel"/>
  <line x1="12" y1="24" x2="12" y2="40" class="line"/>
  <line x1="4" y1="32" x2="20" y2="32" class="line"/>
  
  <!-- Right Solar Panel -->
  <rect x="44" y="24" width="16" height="16" class="panel"/>
  <line x1="52" y1="24" x2="52" y2="40" class="line"/>
  <line x1="44" y1="32" x2="60" y2="32" class="line"/>
  
  <!-- Body -->
  <rect x="24" y="20" width="16" height="24" class="line" fill="#18181b"/>
  <circle cx="32" cy="32" r="4" class="line"/>
  
  <!-- Antenna -->
  <line x1="32" y1="20" x2="32" y2="6" class="line"/>
  <circle cx="32" cy="6" r="2" class="line" fill="#39ff14"/>
  <path d="M26 12 Q32 8 38 12" class="line"/>
</svg>
