<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Celestial: Sun">
  <title>배경 천체 — 태양 (발광 코로나)</title>
  <!-- Transparent bg, dark-surface use. Amber core + phosphor-green corona (cassette palette). -->
  <defs>
    <radialGradient id="sunCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3d6"/>
      <stop offset="34%" stop-color="#ffb23e"/>
      <stop offset="72%" stop-color="#e07a1f"/>
      <stop offset="100%" stop-color="#b5510f"/>
    </radialGradient>
    <radialGradient id="sunCorona" cx="50%" cy="50%" r="50%">
      <stop offset="34%" stop-color="#ffb23e" stop-opacity="0.55"/>
      <stop offset="58%" stop-color="#ffb23e" stop-opacity="0.16"/>
      <stop offset="78%" stop-color="#35e07a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#35e07a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- outer corona glow -->
  <circle cx="160" cy="160" r="158" fill="url(#sunCorona)"/>

  <!-- corona rays -->
  <g stroke="#ffb23e" stroke-width="2" stroke-linecap="round" opacity="0.35">
    <line x1="160" y1="18" x2="160" y2="52"/>
    <line x1="160" y1="268" x2="160" y2="302"/>
    <line x1="18" y1="160" x2="52" y2="160"/>
    <line x1="268" y1="160" x2="302" y2="160"/>
    <line x1="58" y1="58" x2="82" y2="82"/>
    <line x1="262" y1="58" x2="238" y2="82"/>
    <line x1="58" y1="262" x2="82" y2="238"/>
    <line x1="262" y1="262" x2="238" y2="238"/>
  </g>

  <!-- photosphere -->
  <circle cx="160" cy="160" r="96" fill="url(#sunCore)"/>
  <!-- granulation / sunspots -->
  <g fill="#b5510f" opacity="0.5">
    <ellipse cx="132" cy="140" rx="12" ry="8"/>
    <circle cx="190" cy="178" r="7"/>
    <ellipse cx="164" cy="198" rx="9" ry="6"/>
  </g>
  <!-- bright limb -->
  <circle cx="160" cy="160" r="96" fill="none" stroke="#fff3d6" stroke-width="2" opacity="0.5"/>
</svg>
