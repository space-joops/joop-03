<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Sun / Star Background -->
  <style>
    .sun-core {
      fill: #ffb000;
    }
    .sun-corona {
      fill: none;
      stroke: #ffb000;
      stroke-width: 2;
      opacity: 0.6;
    }
    .sun-ray {
      stroke: #ffb000;
      stroke-width: 1.5;
      stroke-dasharray: 4 6;
      opacity: 0.8;
    }
  </style>
  
  <circle cx="64" cy="64" r="20" class="sun-core"/>
  <circle cx="64" cy="64" r="28" class="sun-corona"/>
  <circle cx="64" cy="64" r="36" class="sun-corona" opacity="0.3"/>
  <circle cx="64" cy="64" r="44" class="sun-corona" opacity="0.1"/>
  
  <!-- Rays -->
  <line x1="64" y1="10" x2="64" y2="25" class="sun-ray"/>
  <line x1="64" y1="118" x2="64" y2="103" class="sun-ray"/>
  <line x1="10" y1="64" x2="25" y2="64" class="sun-ray"/>
  <line x1="118" y1="64" x2="103" y2="64" class="sun-ray"/>
  
  <line x1="25" y1="25" x2="35" y2="35" class="sun-ray"/>
  <line x1="103" y1="103" x2="93" y2="93" class="sun-ray"/>
  <line x1="25" y1="103" x2="35" y2="93" class="sun-ray"/>
  <line x1="103" y1="25" x2="93" y2="35" class="sun-ray"/>
</svg>
