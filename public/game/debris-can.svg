<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Debris: crushed can">
  <title>우주 쓰레기 — 찌그러진 캔</title>
  <!-- Transparent bg. Tokens: surface #16202e, bezel #26374a, amber #ffb23e, primary #35e07a. -->
  <g transform="rotate(-8 32 32)">
    <!-- dented can body (crushed waist) -->
    <path d="M 20 14
             L 44 14
             L 42 27 L 46 32 L 41 37 L 44 50
             L 20 50
             L 23 37 L 18 32 L 22 27 Z"
          fill="#16202e" stroke="#26374a" stroke-width="2" stroke-linejoin="round"/>
    <!-- amber label band -->
    <path d="M 22 27 L 42 27 L 46 32 L 41 37 L 23 37 L 18 32 Z" fill="#ffb23e" opacity="0.22"/>
    <path d="M 22 27 L 42 27 M 23 37 L 41 37" stroke="#ffb23e" stroke-width="1.5"/>
    <!-- top rim -->
    <ellipse cx="32" cy="14" rx="12" ry="3" fill="#0a1018" stroke="#33475c" stroke-width="1.5"/>
    <ellipse cx="32" cy="14" rx="6" ry="1.5" fill="#35e07a" opacity="0.3"/>
    <!-- crease highlights -->
    <line x1="30" y1="17" x2="29" y2="47" stroke="#33475c" stroke-width="1" opacity="0.6"/>
    <line x1="36" y1="17" x2="37" y2="47" stroke="#0a1018" stroke-width="1" opacity="0.7"/>
  </g>
</svg>
