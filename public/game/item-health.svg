<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Item: health">
  <title>아이템 — 체력 (수리/회복)</title>
  <!-- Transparent bg, dark-surface use. Tokens: surface #0f1826, bezel #26374a, primary #35e07a. -->
  <!-- badge -->
  <rect x="8" y="8" width="32" height="32" rx="9" fill="#0f1826" stroke="#26374a" stroke-width="2"/>
  <rect x="8" y="8" width="32" height="32" rx="9" fill="none" stroke="#35e07a" stroke-width="1.25" opacity="0.35"/>
  <!-- cross glow -->
  <g fill="#35e07a" opacity="0.2">
    <rect x="20.5" y="13" width="7" height="22" rx="2.5"/>
    <rect x="13" y="20.5" width="22" height="7" rx="2.5"/>
  </g>
  <!-- health cross -->
  <g fill="#35e07a">
    <rect x="21.5" y="14" width="5" height="20" rx="2"/>
    <rect x="14" y="21.5" width="20" height="5" rx="2"/>
  </g>
  <rect x="22.5" y="15" width="1.5" height="8" rx="0.75" fill="#eafff2" opacity="0.55"/>
</svg>
