<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="512" viewBox="0 0 1024 512">
  <!-- 솜브레로(M104) — 측면 원반 + 중앙 더스트 레인. 파생: bg-galaxy-sombrero.webp
       재생성: npm run gen:game. 채도 억제·최대 α≤0.8. -->
  <defs>
    <radialGradient id="bulge">
      <stop offset="0%" stop-color="#fff3dd" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#e3d8c2" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#b6b3ac" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#9aa3b4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cfd4dc" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d9d7cd" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#cfd4dc" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- 벌지(둥근 헤일로) -->
  <ellipse cx="512" cy="240" rx="300" ry="170" fill="url(#bulge)"/>
  <!-- 납작한 원반(5:1) -->
  <ellipse cx="512" cy="268" rx="430" ry="42" fill="url(#disk)" filter="url(#soft4)"/>
  <!-- 중앙 더스트 레인(측면 특유의 어두운 띠) -->
  <ellipse cx="512" cy="276" rx="425" ry="10" fill="#0a0c12" opacity="0.62" filter="url(#soft2)"/>
</svg>
