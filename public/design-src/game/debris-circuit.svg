<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Debris: circuit board">
  <title>우주 쓰레기 — 회로판 조각</title>
  <!-- Transparent bg. Tokens: surface #0f1826, grid #1e5a46, primary #35e07a, amber #ffb23e. -->
  <g transform="rotate(6 32 32)">
    <!-- snapped board (irregular) -->
    <path d="M 12 16 L 50 14 L 52 40 L 44 52 L 16 50 L 10 34 Z"
          fill="#0f1826" stroke="#1e5a46" stroke-width="1.75" stroke-linejoin="round"/>
    <!-- traces -->
    <g fill="none" stroke="#35e07a" stroke-width="1" opacity="0.55" stroke-linecap="round">
      <path d="M 16 22 H 30 V 34 H 44"/>
      <path d="M 20 44 V 30 H 34"/>
      <path d="M 46 20 V 32"/>
    </g>
    <!-- solder pads -->
    <g fill="#35e07a">
      <circle cx="16" cy="22" r="1.6"/>
      <circle cx="44" cy="34" r="1.6"/>
      <circle cx="20" cy="44" r="1.6"/>
      <circle cx="46" cy="20" r="1.6"/>
    </g>
    <!-- chips -->
    <rect x="26" y="22" width="12" height="9" rx="1" fill="#16202e" stroke="#33475c" stroke-width="1"/>
    <rect x="30" y="36" width="10" height="7" rx="1" fill="#16202e" stroke="#33475c" stroke-width="1"/>
    <!-- amber capacitor -->
    <circle cx="43" cy="44" r="3" fill="#ffb23e" opacity="0.8"/>
    <circle cx="43" cy="44" r="3" fill="none" stroke="#ffb23e" stroke-width="1"/>
  </g>
</svg>
