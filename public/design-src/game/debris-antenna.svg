<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Debris: broken dish antenna">
  <title>우주 쓰레기 — 부서진 접시 안테나</title>
  <!-- Transparent bg. Tokens: surface #16202e, bezel #26374a, grid #1e5a46, primary #35e07a, amber #ffb23e. -->
  <g transform="rotate(20 32 32)">
    <!-- dish (cracked) -->
    <path d="M 14 40 A 22 22 0 0 1 50 20 L 44 30 A 12 12 0 0 0 24 40 Z"
          fill="#16202e" stroke="#26374a" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 24 40 A 12 12 0 0 1 44 30" fill="none" stroke="#1e5a46" stroke-width="1.25" opacity="0.8"/>
    <!-- crack -->
    <path d="M 30 39 L 34 30 L 32 24" fill="none" stroke="#ffb23e" stroke-width="1.25" opacity="0.7"/>
    <!-- feed arm + horn -->
    <line x1="32" y1="34" x2="46" y2="14" stroke="#26374a" stroke-width="2" stroke-linecap="round"/>
    <circle cx="46" cy="14" r="4" fill="#0a1018" stroke="#33475c" stroke-width="1.5"/>
    <circle cx="46" cy="14" r="1.6" fill="#35e07a" opacity="0.7"/>
    <!-- bent strut -->
    <line x1="18" y1="38" x2="12" y2="50" stroke="#26374a" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
