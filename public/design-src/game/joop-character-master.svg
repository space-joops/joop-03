<!-- 줍스 캐릭터 마스터(그린 · idle 프레임 0).
     6색 × 3상태(idle/move/collect) × 2프레임 시트는 이 지오메트리의 파라미터 변형 —
     생성 템플릿 전문은 docs/design/handoff-m2.md 부록, 좌표 메타는 public/game/joop-sheet.meta.json.
     셸 #c8d2c4 · 음영 #5c6b5e/#8ba08c · 스크린 #071a0d · 액센트 = 줍스 색(joops[].color) -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="tip"><stop offset="0%" stop-color="#39ff14" stop-opacity=".9"/><stop offset="100%" stop-color="#39ff14" stop-opacity="0"/></radialGradient>
  </defs>
  <g transform="translate(64 64) rotate(0) translate(-64 -64)">
    <!-- 안테나 -->
    <path d="M64 24 V13" stroke="#8ba08c" stroke-width="3"/>
    <circle cx="64" cy="11" r="7" fill="url(#tip)"/>
    <circle cx="64" cy="11" r="3.2" fill="#39ff14"/>
    <!-- 팔(스터브) -->
    <g fill="#c8d2c4" stroke="#5c6b5e" stroke-width="2">
      <rect x="22" y="46" width="12" height="18" rx="6" transform="rotate(6 28 50)"/>
      <rect x="94" y="46" width="12" height="18" rx="6" transform="rotate(-6 100 50)"/>
    </g>
    <!-- 몸통(CRT 셸) -->
    <rect x="34" y="24" width="60" height="54" rx="10" fill="#c8d2c4" stroke="#5c6b5e" stroke-width="2.5"/>
    <rect x="37.5" y="27.5" width="53" height="47" rx="7" fill="none" stroke="#f2f7f0" stroke-opacity=".5" stroke-width="1.5"/>
    <!-- 스크린(얼굴) -->
    <rect x="42" y="32" width="44" height="32" rx="4" fill="#071a0d" stroke="#414d43" stroke-width="2"/>
    <rect x="42" y="32" width="44" height="32" rx="4" fill="#39ff14" opacity=".07"/>
    <rect x="50" y="40" width="7" height="10" rx="1.5" fill="#39ff14"/>
    <rect x="71" y="40" width="7" height="10" rx="1.5" fill="#39ff14"/>
    <rect x="56" y="55" width="16" height="3" rx="1.5" fill="#39ff14" opacity=".9"/>
    <!-- 컨트롤 패널: LED 3개 + 통풍구 -->
    <circle cx="46" cy="71" r="2.2" fill="#39ff14"/>
    <circle cx="53" cy="71" r="2.2" fill="#ffb000" opacity=".85"/>
    <circle cx="60" cy="71" r="2.2" fill="#5c6b5e"/>
    <path d="M72 69.5h14M72 72.5h14" stroke="#8ba08c" stroke-width="1.5"/>
    <!-- 하부 스커트 + 노즐 -->
    <path d="M46 78 H82 L78 88 H50 Z" fill="#414d43"/>
    <rect x="55" y="88" width="18" height="5" rx="2" fill="#2a332c"/>
    
  </g>
  
</svg>
