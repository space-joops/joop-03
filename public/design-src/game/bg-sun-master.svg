<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 2048 2048">
  <!-- 태양 마스터 (실사풍 — 과다노출된 백열 광원) — 파생: public/game/bg-sun.webp
       재생성: npm run gen:game (Chromium 렌더).
       실제 우주 사진에서 태양은 주황 원반이 아니라 순백 코어 + 노출 글로우다.
       만화 광선은 두지 않고, 미세한 수평 스트릭과 희미한 링만 남긴다.
       인게임 앰버 틴트(sunTintAlpha ≤8%)와 겹치므로 글로우 채도는 억제한다. -->
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="16%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fff6e0" stop-opacity="0.96"/>
      <stop offset="46%" stop-color="#ffd9a0" stop-opacity="0.7"/>
      <stop offset="66%" stop-color="#ff9d4d" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe9c8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff4e2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffe9c8" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft12"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <!-- r 을 캔버스 끝까지 채우지 않는다 — 넓은 저알파 글로우는 webp 압축이 급격히 나빠진다 -->
  <circle cx="1024" cy="1024" r="900" fill="url(#glow)"/>
  <!-- 렌즈 스트릭(수평 1쌍) — 카메라 노출 느낌, 아주 절제 -->
  <g filter="url(#soft6)">
    <rect x="64" y="1015" width="1920" height="9" fill="url(#streak)"/>
    <rect x="404" y="1019" width="1240" height="5" fill="url(#streak)" opacity="0.7"/>
  </g>
  <!-- 희미한 글레어 링 -->
  <circle cx="1024" cy="1024" r="520" fill="none" stroke="#ffcf9e" stroke-opacity="0.06" stroke-width="26" filter="url(#soft12)"/>
</svg>
