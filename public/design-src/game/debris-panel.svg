<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Debris: hull panel">
  <title>우주 쓰레기 — 찢긴 선체 패널 조각</title>
  <!-- Transparent bg. Tokens: surface #16202e, bezel #26374a, grid #1e5a46, amber #ffb23e. -->
  <g transform="rotate(-18 32 32)">
    <!-- torn metal panel -->
    <path d="M 12 20 L 40 12 L 52 24 L 50 40 L 44 30 L 38 42 L 30 32 L 22 46 L 14 36 Z"
          fill="#16202e" stroke="#26374a" stroke-width="2" stroke-linejoin="round"/>
    <!-- panel seam -->
    <line x1="18" y1="24" x2="46" y2="20" stroke="#33475c" stroke-width="1.25" opacity="0.8"/>
    <!-- rivets -->
    <g fill="#0a1018" stroke="#33475c" stroke-width="1">
      <circle cx="20" cy="27" r="2"/>
      <circle cx="34" cy="22" r="2"/>
      <circle cx="45" cy="26" r="2"/>
    </g>
    <!-- stencil mark (grid green) -->
    <rect x="24" y="30" width="12" height="4" rx="1" fill="#1e5a46"/>
    <!-- exposed torn edge (amber) -->
    <path d="M 44 30 L 38 42 L 30 32" fill="none" stroke="#ffb23e" stroke-width="1.5" opacity="0.7" stroke-linejoin="round"/>
  </g>
</svg>
