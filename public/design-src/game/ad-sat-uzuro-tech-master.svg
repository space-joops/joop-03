<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="512" viewBox="0 0 1024 512">
  <!-- 광고 위성: UZURO Tech (심우주 탐사 — 육각 본체 + 3방사 붐 안테나). anchor 중심 [512,256].
       워드마크는 코드(캔버스 fillText)가 하단 광고판 위에 그린다 — SVG 텍스트 금지 규약.
       파생 런타임: ../../game/ad-sat-uzuro-tech.svg (gen:game SVG 패스스루). -->
  <defs>
    <linearGradient id="hex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6100"/>
      <stop offset=".35" stop-color="#6b4a00"/>
      <stop offset="1" stop-color="#3a2800"/>
    </linearGradient>
  </defs>
  <g stroke="#5c6b5e" stroke-width="3">
    <!-- 3방사 붐(본체 뒤) -->
    <g stroke="#8ba08c" stroke-width="6">
      <path d="M512 196 L512 64"/>
      <path d="M448 300 L318 388"/>
      <path d="M576 300 L706 388"/>
    </g>
    <circle cx="512" cy="56" r="12" fill="#ffb23e" stroke-width="2"/>
    <circle cx="308" cy="396" r="12" fill="#ffb23e" stroke-width="2"/>
    <circle cx="716" cy="396" r="12" fill="#ffb23e" stroke-width="2"/>
    <!-- 붐 끝 다이폴 -->
    <path d="M488 76 L536 76 M284 380 L332 412 M692 412 L740 380" stroke="#414d43" stroke-width="4"/>
    <!-- 육각 본체(금박 MLI) -->
    <path d="M512 150 L616 208 L616 314 L512 372 L408 314 L408 208 Z" fill="url(#hex)"/>
    <path d="M512 150 L616 208 L616 314 L512 372 L408 314 L408 208 Z" fill="none" stroke="#ffb23e" stroke-width="2" opacity=".5"/>
    <!-- MLI 주름 -->
    <path d="M408 238 h208 M408 284 h208" stroke="#5c3f00" stroke-width="2"/>
    <path d="M460 178 L460 344 M564 178 L564 344" stroke="#5c3f00" stroke-width="2" opacity=".6"/>
    <!-- 스타트래커 + 센서 창 -->
    <rect x="482" y="216" width="60" height="40" rx="4" fill="#0e2f38"/>
    <path d="M482 236 h60" stroke="#ffb23e" stroke-width="1.5" opacity=".5"/>
    <circle cx="512" cy="300" r="16" fill="#2a332c"/>
    <circle cx="512" cy="300" r="7" fill="#ffb23e" stroke="none"/>
    <!-- 소형 태양전지(오른쪽) -->
    <rect x="648" y="220" width="150" height="80" rx="5" fill="#0e2f38"/>
    <g stroke="#ffb23e" stroke-width="1.3" opacity=".4">
      <path d="M685 220v80M722 220v80M759 220v80"/>
      <path d="M648 247h150M648 274h150"/>
    </g>
    <path d="M616 258 h32" stroke="#8ba08c" stroke-width="7"/>
    <!-- 상태등 -->
    <circle cx="436" cy="330" r="6" fill="#39ff14" stroke="none"/>
    <!-- 광고판 트러스 + 패널 -->
    <path d="M472 372 L452 394 M552 372 L572 394" stroke="#8ba08c" stroke-width="5"/>
    <rect x="302" y="394" width="420" height="66" rx="6" fill="#140e02" stroke="#ffb23e" stroke-width="4"/>
    <rect x="314" y="404" width="396" height="46" rx="3" fill="none" stroke="#ffb23e" stroke-width="1.5" opacity=".35"/>
  </g>
  <!-- 좌상단 림 라이트 -->
  <path d="M512 150 L408 208 L416 216 L512 162 Z" fill="#ffd98f" opacity=".5"/>
</svg>
