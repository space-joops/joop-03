<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="Satellite: communications (near)">
  <title>위성 — 통신위성 (근경/대형, 원근 스케일용)</title>
  <!-- Transparent bg, dark-surface use. Detailed near-scale variant. Scale down for distance.
       Tokens: surface #0f1826/#16202e, bezel #26374a, grid #1e5a46, primary #35e07a, amber #ffb23e. -->

  <!-- solar wing booms -->
  <line x1="116" y1="90" x2="60" y2="90" stroke="#26374a" stroke-width="4" stroke-linecap="round"/>
  <line x1="204" y1="90" x2="260" y2="90" stroke="#26374a" stroke-width="4" stroke-linecap="round"/>

  <!-- left solar array -->
  <g>
    <rect x="16" y="64" width="100" height="52" rx="3" fill="#0f1826" stroke="#26374a" stroke-width="2"/>
    <g stroke="#1e5a46" stroke-width="1.25" opacity="0.9">
      <line x1="41" y1="64" x2="41" y2="116"/><line x1="66" y1="64" x2="66" y2="116"/><line x1="91" y1="64" x2="91" y2="116"/>
      <line x1="16" y1="90" x2="116" y2="90"/>
    </g>
    <g fill="#35e07a" opacity="0.12"><rect x="18" y="66" width="21" height="22"/><rect x="68" y="92" width="21" height="22"/></g>
  </g>
  <!-- right solar array -->
  <g>
    <rect x="204" y="64" width="100" height="52" rx="3" fill="#0f1826" stroke="#26374a" stroke-width="2"/>
    <g stroke="#1e5a46" stroke-width="1.25" opacity="0.9">
      <line x1="229" y1="64" x2="229" y2="116"/><line x1="254" y1="64" x2="254" y2="116"/><line x1="279" y1="64" x2="279" y2="116"/>
      <line x1="204" y1="90" x2="304" y2="90"/>
    </g>
    <g fill="#35e07a" opacity="0.12"><rect x="231" y="66" width="21" height="22"/><rect x="281" y="92" width="21" height="22"/></g>
  </g>

  <!-- central bus -->
  <rect x="116" y="60" width="88" height="60" rx="6" fill="#16202e" stroke="#26374a" stroke-width="2.5"/>
  <rect x="116" y="60" width="88" height="60" rx="6" fill="none" stroke="#35e07a" stroke-width="1" opacity="0.2"/>
  <!-- bus panel detail -->
  <rect x="126" y="70" width="30" height="40" rx="3" fill="#0a1018" stroke="#33475c" stroke-width="1"/>
  <g fill="#35e07a" opacity="0.85"><rect x="130" y="76" width="22" height="3" rx="1.5"/><rect x="130" y="83" width="14" height="3" rx="1.5" opacity="0.6"/></g>
  <rect x="130" y="92" width="10" height="12" rx="1.5" fill="#35e07a" opacity="0.5"/>
  <rect x="144" y="92" width="10" height="12" rx="1.5" fill="#1e5a46"/>
  <!-- MLI foil seams -->
  <g stroke="#33475c" stroke-width="1" opacity="0.6"><line x1="164" y1="66" x2="164" y2="114"/><line x1="184" y1="66" x2="184" y2="114"/></g>
  <!-- amber status beacon -->
  <circle cx="194" cy="72" r="6" fill="#ffb23e" opacity="0.22"/>
  <circle cx="194" cy="72" r="3" fill="#ffb23e"/>

  <!-- high-gain dish -->
  <g transform="translate(160 46) rotate(-18)">
    <ellipse cx="0" cy="0" rx="26" ry="16" fill="#16202e" stroke="#26374a" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="17" ry="10" fill="none" stroke="#1e5a46" stroke-width="1.25"/>
    <line x1="0" y1="0" x2="10" y2="-18" stroke="#26374a" stroke-width="2" stroke-linecap="round"/>
    <circle cx="10" cy="-18" r="3.5" fill="#0a1018" stroke="#33475c" stroke-width="1.25"/>
    <circle cx="10" cy="-18" r="1.4" fill="#35e07a" opacity="0.8"/>
  </g>

  <!-- thruster nozzles -->
  <g fill="#0a1018" stroke="#26374a" stroke-width="1.5">
    <path d="M 148 120 l -4 10 l 12 0 l -4 -10 Z"/>
    <path d="M 172 120 l -4 10 l 12 0 l -4 -10 Z"/>
  </g>
</svg>
