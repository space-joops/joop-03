<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Cassette Futurism Joystick (5 translucent circles) -->
  <style>
    .joy-circle {
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      opacity: 0.3;
    }
    .joy-center {
      fill: #ffffff;
      opacity: 0.5;
    }
  </style>
  
  <!-- Outer boundary -->
  <circle cx="50" cy="50" r="45" class="joy-circle" stroke-dasharray="4 4" />
  
  <!-- Directional indicators -->
  <circle cx="50" cy="15" r="8" class="joy-circle" />
  <circle cx="50" cy="85" r="8" class="joy-circle" />
  <circle cx="15" cy="50" r="8" class="joy-circle" />
  <circle cx="85" cy="50" r="8" class="joy-circle" />
  
  <!-- Center knob -->
  <circle cx="50" cy="50" r="16" class="joy-center" />
  <circle cx="50" cy="50" r="22" class="joy-circle" />
</svg>
