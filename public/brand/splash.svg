<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852">
  <!-- PWA Splash Screen -->
  <rect width="393" height="852" fill="#09090b"/>
  <!-- Starfield simple -->
  <circle cx="50" cy="100" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="300" cy="200" r="2" fill="#fff" opacity="0.3"/>
  <circle cx="150" cy="500" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="350" cy="700" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="80" cy="800" r="2" fill="#fff" opacity="0.2"/>
  
  <g transform="translate(146, 376)">
    <!-- Symbol scaled down -->
    <g transform="scale(1)">
      <circle cx="50" cy="50" r="42" fill="none" stroke="#39ff14" stroke-width="4" stroke-dasharray="10 5" opacity="0.8"/>
      <rect x="35" y="35" width="30" height="30" fill="none" stroke="#39ff14" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/>
      <circle cx="50" cy="50" r="4" fill="#39ff14"/>
    </g>
  </g>
  
  <!-- Wordmark -->
  <text x="196.5" y="520" font-family="'Courier New', monospace" font-size="32" font-weight="900" fill="#39ff14" text-anchor="middle" letter-spacing="4">JOOPS</text>
  <text x="196.5" y="550" font-family="sans-serif" font-size="12" fill="#a1a1aa" text-anchor="middle" letter-spacing="2">ORBITAL CLEANUP INITIATIVE</text>
</svg>
